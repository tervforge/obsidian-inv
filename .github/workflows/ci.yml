name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Builds dist/ and the installable archive, runs all tests, and fails if versions.json
      # is out of date with manifest.json (run `npm run build` and commit it).
      - name: Build, package and test
        run: npm run check

      # Lets you download a build of any commit from the run's summary page.
      - uses: actions/upload-artifact@v4
        with:
          name: invoklet-markdown
          path: dist/invoklet-markdown.zip
          if-no-files-found: error
