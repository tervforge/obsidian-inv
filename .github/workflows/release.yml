name: Release

# Push a tag equal to the version in manifest.json, without a "v" prefix
# (Obsidian expects that), e.g.:  git tag 0.3.5 && git push origin 0.3.5
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          min_app="$(node -p "require('./manifest.json').minAppVersion")"
          listed="$(node -p "require('./versions.json')[process.argv[1]] ?? ''" "$version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest.json version $version"; exit 1
          fi
          if [ "$listed" != "$min_app" ]; then
            echo "::error::versions.json has no entry \"$version\": \"$min_app\". Run npm run build and commit."; exit 1
          fi

      # Builds dist/ (main.js, manifest.json, styles.css) and dist/invoklet-markdown.zip, runs tests.
      - name: Build, package and test
        run: npm run check

      # The three separate files are what Obsidian's plugin directory and tools like BRAT expect;
      # the archive is for manual installation (unpack into <vault>/.obsidian/plugins/).
      # Its name has no version, so releases/latest/download/invoklet-markdown.zip always works.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/invoklet-markdown.zip dist/main.js dist/manifest.json dist/styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
